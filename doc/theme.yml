# Section markers and typography inspired by Evan Chen's evan.sty:
# https://github.com/vEnhance/dotfiles/blob/main/texmf/tex/latex/evan/evan.sty
# This is an Asciidoctor PDF theme with Petrona text and JetBrains Mono code.
extends: default
# Change these families to restyle the document. Register their four faces below.
body_font_family: Petrona
code_font_family: JetBrainsMono
chapter_font_family: $body_font_family
palette:
  ink: "202027"
  muted: "565260"
  accent: "A3242F"
  rule: "E1CBCF"
  paper: "FFFFFF"
  panel: "FFFCFC"
  code_border: "D8B5BC"
  table_header_background: "F7ECEE"
  table_header_text: "76202A"
font:
  catalog:
    merge: true
    Petrona:
      normal: Petrona-Regular.ttf
      italic: Petrona-Italic.ttf
      bold: Petrona-Bold.ttf
      bold_italic: Petrona-BoldItalic.ttf
    JetBrainsMono:
      normal: JetBrainsMono-Regular.ttf
      italic: JetBrainsMono-Italic.ttf
      bold: JetBrainsMono-Bold.ttf
      bold_italic: JetBrainsMono-BoldItalic.ttf
page:
  size: A4
  margin: [18mm, 18mm, 19mm, 18mm]
  background_color: $palette_paper
base:
  font_family: $body_font_family
  font_size: 11
  font_color: $palette_ink
  line_height: 1.12
vertical_rhythm: 6
block:
  margin_bottom: 6
prose:
  margin_bottom: 3
list:
  item_spacing: 1
ulist:
  marker:
    font_size: 16
    # Petrona has no small square (U+25AA), which marks the references.
    square:
      font_family: $code_font_family
heading:
  font_family: $body_font_family
  font_style: bold
  font_color: $palette_accent
  min_height_after: auto
  chapter_break_before: always
  h1_font_size: 25
  h2_font_family: $chapter_font_family
  h2_font_size: 21
  h2_font_color: $base_font_color
  h2_margin_bottom: 15
  h3_font_size: 12
  h4_font_size: 11
  margin_top: 11
  margin_bottom: 5
title_page:
  background_color: $palette_panel
  background_image: image:cover.svg[]
  align: center
  title:
    font_family: $body_font_family
    font_style: bold
    font_size: 30
    font_color: $palette_accent
    top: 26%
link:
  font_color: $palette_accent
codespan:
  font_family: $code_font_family
  font_color: $palette_ink
  font_size: 0.85em
code:
  font_family: $code_font_family
  font_size: 9
  line_height: 1.1
  background_color: $palette_panel
  border_color: $palette_code_border
  border_width: 0.5
  border_radius: 0
  padding: [4, 7, 4, 7]
  margin_bottom: 5
table:
  font_size: 9
  head_background_color: $palette_table_header_background
  head_font_color: $palette_table_header_text
  head_font_style: bold
  body_stripe_background_color: $palette_panel
  border_color: $palette_rule
  border_width: 0.35
  cell_padding: [4, 4, 4, 4]
role:
  chapter-number:
    font_family: $body_font_family
    font_size: 54
    font_style: normal
    font_color: $heading_font_color
caption:
  font_family: $body_font_family
  font_style: italic
  font_size: 10
toc:
  font_family: $body_font_family
  font_size: 10.5
  line_height: 1.08
  indent: 12
  margin_top: 0
  h2_font_size: 11.3
  h2_font_style: bold
  h2_font_color: $palette_accent
  h3_font_size: 10.5
  h4_font_size: 10.5
  title:
    font_family: $body_font_family
    font_size: 22
header:
  font_family: $body_font_family
  font_size: 8
  font_color: $palette_muted
  border_color: $palette_rule
  border_width: 0.4
  height: 13mm
  recto:
    right:
      content: "{section-or-chapter-title}"
  verso:
    left:
      content: "{section-or-chapter-title}"
footer:
  font_family: $body_font_family
  font_size: 9
  font_color: $palette_muted
  recto:
    left:
      content: ""
    center:
      content: "TARA ISA  ·  {page-number}"
    right:
      content: ""
  verso:
    left:
      content: ""
    center:
      content: "TARA ISA  ·  {page-number}"
    right:
      content: ""
