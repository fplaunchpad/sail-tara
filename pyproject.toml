[project]
name = "tara-tools"
version = "0.1.0"
description = "Reference-simulator wrappers and differential tests for the TARA Sail model"
requires-python = ">=3.15.0rc2"
dependencies = ["click==8.3.3", "msgspec==0.21.1"]

[dependency-groups]
# Pinned, like the runtime dependencies, to the nixpkgs releases the Nix checks run.
dev = [
    "black==26.5.1",
    "pyright==1.1.414",
    "ruff==0.16.8",
]

[tool.uv]
package = false
python-downloads = "never"
default-groups = ["dev"]

[tool.black]
line-length = 100
target-version = ["py315"]

[tool.tara]
# The test suite's dependencies, pinned to nixpkgs like the others. Nix provides them, in
# development too ($TARA_PYTHON): Hypothesis publishes no wheels for Python 3.15, so uv cannot.
test-dependencies = ["hypothesis==6.156.1", "pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
line-length = 100
# Ruff's Python 3.15 support is preview-only; no 3.15-only syntax is used.
target-version = "py314"
src = ["tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PERF", "PTH"]
ignore = ["E501", "SIM108"]

[tool.pyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"
include = ["tools", "typings", "tests"]
exclude = [".venv", "result", "build"]
extraPaths = ["tools", "tests"]
stubPath = "typings"
reportUnnecessaryTypeIgnoreComment = "error"
reportMatchNotExhaustive = "error"
# The TARA Studio modules exist only on PYTHONPATH at runtime (from the Nix
# store); typings/ carries their stubs.
reportMissingModuleSource = "none"
